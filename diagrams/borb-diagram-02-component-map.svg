<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">BORB Component Map</title>
  <desc id="desc">UML-style component map for BORB showing dependencies from market data to decision layer.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16243d"/>
      <stop offset="100%" stop-color="#1f3a5f"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <style>
      .title { font: 700 34px Georgia, serif; fill: #f2c75c; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #9cc6f3; }
      .card { fill: url(#card); stroke: rgba(148,163,184,.35); stroke-width: 2; rx: 18; ry: 18; }
      .label { font: 700 18px Arial, sans-serif; fill: #e5eefc; }
      .small { font: 500 14px Arial, sans-serif; fill: #bfd4f5; }
      .link { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrow2); }
    </style>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg2)"/>
  <text x="60" y="72" class="title">BORB Component Map</text>
  <text x="60" y="102" class="subtitle">High-level architectural components and the dependencies between them.</text>

  <rect x="80" y="170" width="260" height="120" class="card"/>
  <text x="210" y="214" text-anchor="middle" class="label">Market Data Foundation</text>
  <text x="210" y="242" text-anchor="middle" class="small">vendor adapters</text>
  <text x="210" y="264" text-anchor="middle" class="small">normalization</text>

  <rect x="430" y="170" width="300" height="120" class="card"/>
  <text x="580" y="214" text-anchor="middle" class="label">Assumption Validation Engine</text>
  <text x="580" y="242" text-anchor="middle" class="small">benchmark checks</text>
  <text x="580" y="264" text-anchor="middle" class="small">provenance + trust</text>

  <rect x="820" y="170" width="300" height="120" class="card"/>
  <text x="970" y="214" text-anchor="middle" class="label">Underwriting Problem</text>
  <text x="970" y="242" text-anchor="middle" class="small">known assumptions</text>
  <text x="970" y="264" text-anchor="middle" class="small">targets + constraints</text>

  <rect x="1210" y="170" width="300" height="120" class="card"/>
  <text x="1360" y="214" text-anchor="middle" class="label">Reverse Solve Engine</text>
  <text x="1360" y="242" text-anchor="middle" class="small">feasible set generation</text>
  <text x="1360" y="264" text-anchor="middle" class="small">market-aligned ranking</text>

  <rect x="620" y="390" width="360" height="120" class="card"/>
  <text x="800" y="434" text-anchor="middle" class="label">Scenario Generator</text>
  <text x="800" y="462" text-anchor="middle" class="small">from assumptions or solved candidates</text>
  <text x="800" y="484" text-anchor="middle" class="small">builds canonical runnable scenarios</text>

  <rect x="620" y="610" width="360" height="120" class="card"/>
  <text x="800" y="654" text-anchor="middle" class="label">Scenario Store</text>
  <text x="800" y="682" text-anchor="middle" class="small">save, load, version, compare</text>

  <rect x="80" y="840" width="230" height="110" class="card"/>
  <rect x="360" y="840" width="230" height="110" class="card"/>
  <rect x="640" y="840" width="230" height="110" class="card"/>
  <rect x="920" y="840" width="230" height="110" class="card"/>
  <rect x="1200" y="840" width="230" height="110" class="card"/>

  <text x="195" y="890" text-anchor="middle" class="label">Simulation Engine</text>
  <text x="195" y="918" text-anchor="middle" class="small">sensitivity + stress</text>

  <text x="475" y="890" text-anchor="middle" class="label">Optimization Engine</text>
  <text x="475" y="918" text-anchor="middle" class="small">bounded by market realism</text>

  <text x="755" y="890" text-anchor="middle" class="label">IRR Lab</text>
  <text x="755" y="918" text-anchor="middle" class="small">deterministic + Monte Carlo</text>

  <text x="1035" y="890" text-anchor="middle" class="label">Valuation Engine</text>
  <text x="1035" y="918" text-anchor="middle" class="small">comp-backed valuation logic</text>

  <text x="1315" y="890" text-anchor="middle" class="label">Compare Engine</text>
  <text x="1315" y="918" text-anchor="middle" class="small">lineage + trust-aware compare</text>

  <rect x="540" y="980" width="520" height="70" class="card"/>
  <text x="800" y="1023" text-anchor="middle" class="label">Decision Layer</text>
  <text x="800" y="1045" text-anchor="middle" class="small">drivers, breaches, invalidation risks, snapshots, underwriting memory</text>

  <path d="M340 230 L430 230" class="link"/>
  <path d="M730 230 L820 230" class="link"/>
  <path d="M1120 230 L1210 230" class="link"/>
  <path d="M970 290 L970 330 L800 330 L800 390" class="link"/>
  <path d="M1360 290 L1360 330 L900 330 L900 390" class="link"/>
  <path d="M800 510 L800 610" class="link"/>
  <path d="M800 730 L800 790 L195 790 L195 840" class="link"/>
  <path d="M800 730 L800 790 L475 790 L475 840" class="link"/>
  <path d="M800 730 L800 790 L755 790 L755 840" class="link"/>
  <path d="M800 730 L800 790 L1035 790 L1035 840" class="link"/>
  <path d="M800 730 L800 790 L1315 790 L1315 840" class="link"/>
  <path d="M195 950 L195 965 L800 965 L800 980" class="link"/>
  <path d="M475 950 L475 965 L800 965 L800 980" class="link"/>
  <path d="M755 950 L755 980" class="link"/>
  <path d="M1035 950 L1035 965 L800 965 L800 980" class="link"/>
  <path d="M1315 950 L1315 965 L800 965 L800 980" class="link"/>
</svg>
