<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">BORB Reverse Solve Logic</title>
  <desc id="desc">Reverse solve flow showing how target metrics and constraints become ranked feasible scenario outputs.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 32px Georgia, serif; fill: #f2c75c; }
      .sub { font: 500 16px Arial, sans-serif; fill: #a7c7ec; }
      .box { fill: url(#box3); stroke: rgba(196,181,253,.4); stroke-width: 2; rx: 18; ry: 18; }
      .label { font: 700 18px Arial, sans-serif; fill: #eef4ff; }
      .small { font: 500 14px Arial, sans-serif; fill: #cedcf9; }
      .line { stroke: #7dd3fc; stroke-width: 3; fill: none; marker-end: url(#arrow3); }
    </style>
  </defs>
  <rect width="1400" height="700" fill="url(#bg3)"/>
  <text x="60" y="70" class="title">Reverse Solve / Constraint Logic</text>
  <text x="60" y="100" class="sub">Path B does not return one magic answer. It returns a ranked feasible scenario set.</text>

  <rect x="70" y="220" width="230" height="110" class="box"/>
  <rect x="380" y="220" width="230" height="110" class="box"/>
  <rect x="690" y="220" width="230" height="110" class="box"/>
  <rect x="1000" y="220" width="260" height="110" class="box"/>

  <text x="185" y="262" text-anchor="middle" class="label">Target Metrics / Constraints</text>
  <text x="185" y="290" text-anchor="middle" class="small">IRR, cap rate, DSCR, price,</text>
  <text x="185" y="312" text-anchor="middle" class="small">stress limits, lender rules</text>

  <text x="495" y="262" text-anchor="middle" class="label">Market Bounds</text>
  <text x="495" y="290" text-anchor="middle" class="small">realistic vendor-backed</text>
  <text x="495" y="312" text-anchor="middle" class="small">ranges and benchmark rails</text>

  <text x="805" y="262" text-anchor="middle" class="label">Constraint Engine</text>
  <text x="805" y="290" text-anchor="middle" class="small">filters impossible and</text>
  <text x="805" y="312" text-anchor="middle" class="small">fragile regions first</text>

  <text x="1130" y="262" text-anchor="middle" class="label">Feasible Solution Search</text>
  <text x="1130" y="290" text-anchor="middle" class="small">explores assumption regions</text>
  <text x="1130" y="312" text-anchor="middle" class="small">that satisfy the problem</text>

  <rect x="160" y="470" width="260" height="120" class="box"/>
  <rect x="570" y="470" width="260" height="120" class="box"/>
  <rect x="980" y="470" width="260" height="120" class="box"/>

  <text x="290" y="512" text-anchor="middle" class="label">Market-Aligned</text>
  <text x="290" y="540" text-anchor="middle" class="small">highest realism and strongest</text>
  <text x="290" y="562" text-anchor="middle" class="small">institutional fit</text>

  <text x="700" y="512" text-anchor="middle" class="label">Conservative</text>
  <text x="700" y="540" text-anchor="middle" class="small">safer margin structure and</text>
  <text x="700" y="562" text-anchor="middle" class="small">stronger downside posture</text>

  <text x="1110" y="512" text-anchor="middle" class="label">Stretched</text>
  <text x="1110" y="540" text-anchor="middle" class="small">meets targets under more</text>
  <text x="1110" y="562" text-anchor="middle" class="small">aggressive assumptions</text>

  <text x="700" y="650" text-anchor="middle" class="sub">Ranking order: 1) market alignment 2) constraint satisfaction 3) target fit 4) robustness / sensitivity</text>

  <path d="M300 275 L380 275" class="line"/>
  <path d="M610 275 L690 275" class="line"/>
  <path d="M920 275 L1000 275" class="line"/>
  <path d="M1130 330 L1130 390 L290 390 L290 470" class="line"/>
  <path d="M1130 330 L1130 470 L700 470" class="line"/>
  <path d="M1130 330 L1130 470" class="line"/>
</svg>
