<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">BORB Major Engines Map</title>
  <desc id="desc">High-level architecture diagram of BORB showing ingestion paths, canonical scenario model, quantitative engines, math layer, AI interpretation layer, and output surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7d46a"/>
      <stop offset="100%" stop-color="#c8931c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36d5ff"/>
      <stop offset="100%" stop-color="#1284d7"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b68cff"/>
      <stop offset="100%" stop-color="#7048e8"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#0f9f6e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d6aa41"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#42b5ee"/>
    </marker>
    <style>
      .title { font: 700 34px Georgia, 'Times New Roman', serif; fill: #f4d269; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #b7c3d8; }
      .section { font: 700 18px Arial, Helvetica, sans-serif; fill: #eef4ff; letter-spacing: 0.08em; }
      .card-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #f7fbff; }
      .card-body { font: 400 15px Arial, Helvetica, sans-serif; fill: #c8d4e8; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #9fb0c8; }
      .label { font: 700 14px Arial, Helvetica, sans-serif; fill: #e5edf9; letter-spacing: 0.06em; }
      .mono { font: 600 13px 'SFMono-Regular', Menlo, Consolas, monospace; fill: #d4deef; }
      .card { rx: 24; ry: 24; filter: url(#shadow); }
      .chip { rx: 11; ry: 11; }
      .line { fill: none; stroke-linecap: round; stroke-width: 4; }
      .line-soft { fill: none; stroke-linecap: round; stroke-width: 3; stroke-dasharray: 8 10; opacity: 0.85; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>

  <text x="82" y="78" class="title">BORB Major Engines</text>
  <text x="82" y="108" class="subtitle">A high-level view of how BORB ingests real estate data, forms canonical scenarios, runs deterministic quantitative engines, and overlays AI interpretation.</text>

  <!-- Ingestion -->
  <text x="82" y="168" class="section">INGESTION</text>
  <rect x="70" y="190" width="340" height="170" class="card" fill="#152033" stroke="#3b82f6" stroke-opacity="0.35"/>
  <text x="98" y="230" class="card-title">Onboarding Paths</text>
  <text x="98" y="262" class="card-body">• Smart import and schema mapping</text>
  <text x="98" y="290" class="card-body">• Templatized bulk upload</text>
  <text x="98" y="318" class="card-body">• Manual ingestion and edit forms</text>
  <text x="98" y="344" class="small">Purpose: get ordinary real estate data into one structured workflow.</text>

  <!-- Canonical model -->
  <text x="500" y="168" class="section">CANONICAL MODEL</text>
  <rect x="488" y="190" width="330" height="170" class="card" fill="#192231" stroke="#d6aa41" stroke-opacity="0.4"/>
  <text x="518" y="230" class="card-title">Structured Scenario Chain</text>
  <text x="518" y="262" class="mono">Portfolio → Lead → Scenario → KPIs</text>
  <text x="518" y="292" class="card-body">• Scenario is the underwriting state</text>
  <text x="518" y="320" class="card-body">• Same scenario can feed every major engine</text>
  <text x="518" y="346" class="small">This is the main object BORB preserves, compares, and saves.</text>

  <!-- Math layer -->
  <text x="904" y="168" class="section">QUANT / MATH LAYER</text>
  <rect x="892" y="190" width="630" height="170" class="card" fill="#162032" stroke="#8b5cf6" stroke-opacity="0.38"/>
  <text x="922" y="230" class="card-title">Deterministic Financial Engines</text>
  <text x="922" y="262" class="card-body">• Cash-flow formulas and KPI recomputation</text>
  <text x="922" y="290" class="card-body">• Time-based event modeling: rent, refinance, sale</text>
  <text x="922" y="318" class="card-body">• Metric normalization, weighted scoring, ranking</text>
  <text x="922" y="346" class="card-body">• Monte Carlo IRR distribution around a base case</text>
  <text x="1265" y="346" class="small">Not a black-box AI solver</text>

  <!-- Main engines row -->
  <text x="82" y="438" class="section">MAJOR ENGINES</text>

  <rect x="70" y="460" width="230" height="156" class="card" fill="#172336" stroke="#2dd4bf" stroke-opacity="0.35"/>
  <text x="95" y="500" class="card-title">Simulation</text>
  <text x="95" y="532" class="card-body">Category-specific scenario shocks and sensitivity views.</text>
  <text x="95" y="570" class="small">Profitability • Risk • Efficiency • Returns</text>

  <rect x="326" y="460" width="230" height="156" class="card" fill="#172336" stroke="#4ade80" stroke-opacity="0.35"/>
  <text x="351" y="500" class="card-title">Optimization</text>
  <text x="351" y="532" class="card-body">Rule-based scenario tuning with KPI recomputation.</text>
  <text x="351" y="570" class="small">Profitability • Risk • Efficiency</text>

  <rect x="582" y="460" width="230" height="156" class="card" fill="#172336" stroke="#f59e0b" stroke-opacity="0.35"/>
  <text x="607" y="500" class="card-title">Valuation</text>
  <text x="607" y="532" class="card-body">Cost, sales comparison, and market-facing valuation support.</text>
  <text x="607" y="570" class="small">Structured property-level pricing lenses</text>

  <rect x="838" y="460" width="230" height="156" class="card" fill="#172336" stroke="#60a5fa" stroke-opacity="0.35"/>
  <text x="863" y="500" class="card-title">Comparison</text>
  <text x="863" y="532" class="card-body">Scenario-to-scenario and lead-to-lead comparison.</text>
  <text x="863" y="570" class="small">Weighted scorecard • Radar • Rankings</text>

  <rect x="1094" y="460" width="230" height="156" class="card" fill="#172336" stroke="#c084fc" stroke-opacity="0.35"/>
  <text x="1119" y="500" class="card-title">IRR Workspace</text>
  <text x="1119" y="532" class="card-body">Scenario-bound return path with timed cash-flow events.</text>
  <text x="1119" y="570" class="small">Deterministic IRR • Monte Carlo • Compare</text>

  <rect x="1350" y="460" width="172" height="156" class="card" fill="#172336" stroke="#f472b6" stroke-opacity="0.35"/>
  <text x="1375" y="500" class="card-title">Reporting</text>
  <text x="1375" y="532" class="card-body">Exportable scorecards, narratives, charts, and committee-style outputs.</text>

  <!-- AI layer -->
  <text x="82" y="690" class="section">INTERPRETATION LAYER</text>
  <rect x="70" y="712" width="1452" height="118" class="card" fill="#142235" stroke="#d6aa41" stroke-opacity="0.28"/>
  <text x="102" y="752" class="card-title">AI Interpretation Layer</text>
  <text x="102" y="784" class="card-body">BORB uses AI for explanation, insight generation, narrative framing, and executive-readable guidance.</text>
  <text x="102" y="812" class="small">The quantitative engines generate the numbers. AI explains them.</text>

  <!-- Outputs -->
  <text x="82" y="896" class="section">OUTPUTS / USER VALUE</text>
  <rect x="70" y="918" width="1452" height="82" class="card" fill="#151f31" stroke="#42b5ee" stroke-opacity="0.28"/>
  <text x="102" y="958" class="card-body">Clear scenario lineage • faster underwriting review • branch-based comparison • timeline-aware return analysis • committee-ready interpretation • less spreadsheet drift</text>

  <!-- Connectors -->
  <path d="M410 275 C445 275, 455 275, 488 275" class="line" stroke="#d6aa41" marker-end="url(#arrowGold)"/>
  <path d="M818 275 C848 275, 860 275, 892 275" class="line" stroke="#42b5ee" marker-end="url(#arrowBlue)"/>

  <path d="M653 360 C653 402, 653 422, 653 460" class="line-soft" stroke="#d6aa41" marker-end="url(#arrowGold)"/>
  <path d="M1210 360 C1210 402, 1210 422, 1210 460" class="line-soft" stroke="#8b5cf6" marker-end="url(#arrowBlue)"/>
  <path d="M954 360 C954 402, 954 422, 954 460" class="line-soft" stroke="#42b5ee" marker-end="url(#arrowBlue)"/>
  <path d="M442 360 C442 402, 442 422, 442 460" class="line-soft" stroke="#42b5ee" marker-end="url(#arrowBlue)"/>

  <path d="M786 616 C786 662, 786 680, 786 712" class="line" stroke="#d6aa41" marker-end="url(#arrowGold)"/>
  <path d="M786 830 C786 872, 786 888, 786 918" class="line" stroke="#42b5ee" marker-end="url(#arrowBlue)"/>

  <!-- Footer note -->
  <text x="82" y="1022" class="small">Suggested positioning: BORB is a scenario-intelligence system for real estate teams. It starts with normal real estate data, structures it, computes deterministic finance outputs, and adds AI only where interpretation helps.</text>
</svg>
