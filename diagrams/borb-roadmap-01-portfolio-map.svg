<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">BORB Product Portfolio Map</title>
  <desc id="desc">Keep, rebuild, add, and archive roadmap map for the next version of BORB.</desc>
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="keep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123b33"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="rebuild" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f2a12"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="add" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13243d"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="archive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1b2f"/>
      <stop offset="100%" stop-color="#6b213d"/>
    </linearGradient>
    <style>
      .title { font: 700 34px Georgia, serif; fill: #f2c75c; }
      .sub { font: 500 16px Arial, sans-serif; fill: #a9c8ee; }
      .panel { stroke: rgba(148,163,184,.28); stroke-width: 2; rx: 22; ry: 22; }
      .h { font: 700 26px Arial, sans-serif; fill: #eef4ff; }
      .label { font: 700 15px Arial, sans-serif; fill: #f8fbff; }
      .item { font: 500 14px Arial, sans-serif; fill: #dbe9ff; }
      .chip { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.12); stroke-width: 1; rx: 12; ry: 12; }
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bgp)"/>
  <text x="60" y="72" class="title">BORB Product Portfolio Map</text>
  <text x="60" y="102" class="sub">What stays, what gets rebuilt, what must be added, and what should be demoted or archived to restore institutional credibility.</text>

  <rect x="60" y="150" width="700" height="340" class="panel" fill="url(#keep)"/>
  <rect x="840" y="150" width="700" height="340" class="panel" fill="url(#rebuild)"/>
  <rect x="60" y="560" width="700" height="340" class="panel" fill="url(#add)"/>
  <rect x="840" y="560" width="700" height="340" class="panel" fill="url(#archive)"/>

  <text x="100" y="200" class="h">Keep and Strengthen</text>
  <text x="880" y="200" class="h">Rebuild Materially</text>
  <text x="100" y="610" class="h">Add as Core Foundation</text>
  <text x="880" y="610" class="h">Demote or Archive if Unsourced</text>

  <g transform="translate(100 240)">
    <rect width="250" height="42" class="chip"/><text x="18" y="27" class="label">Scenario Workflow + Compare</text>
    <rect y="56" width="250" height="42" class="chip"/><text x="18" y="83" class="label">IRR / Return Lab</text>
    <rect y="112" width="250" height="42" class="chip"/><text x="18" y="139" class="label">Simulation Engine</text>
    <rect y="168" width="250" height="42" class="chip"/><text x="18" y="195" class="label">Optimization Engine</text>
    <rect y="224" width="250" height="42" class="chip"/><text x="18" y="251" class="label">Onboarding Infrastructure</text>
  </g>
  <g transform="translate(390 244)">
    <text class="item">Keep these as the visible product core,</text>
    <text y="24" class="item">but re-anchor them in market-grounded</text>
    <text y="48" class="item">assumptions, trust labels, and constraint-aware logic.</text>
  </g>

  <g transform="translate(880 240)">
    <rect width="250" height="42" class="chip"/><text x="18" y="27" class="label">Market Context Panels</text>
    <rect y="56" width="250" height="42" class="chip"/><text x="18" y="83" class="label">Benchmark / Threshold Logic</text>
    <rect y="112" width="250" height="42" class="chip"/><text x="18" y="139" class="label">Assumption UX + Language</text>
    <rect y="168" width="250" height="42" class="chip"/><text x="18" y="195" class="label">Optimization Bounds</text>
    <rect y="224" width="250" height="42" class="chip"/><text x="18" y="251" class="label">Demo Data + Seed Scenarios</text>
  </g>
  <g transform="translate(1170 244)">
    <text class="item">These areas currently weaken trust when</text>
    <text y="24" class="item">they look synthetic, unsourced, or arbitrary.</text>
    <text y="48" class="item">They must be rebuilt around real benchmark provenance.</text>
  </g>

  <g transform="translate(100 650)">
    <rect width="250" height="42" class="chip"/><text x="18" y="27" class="label">Market Data Foundation</text>
    <rect y="56" width="250" height="42" class="chip"/><text x="18" y="83" class="label">Assumption Validation Engine</text>
    <rect y="112" width="250" height="42" class="chip"/><text x="18" y="139" class="label">Provenance / Trust Scoring</text>
    <rect y="168" width="250" height="42" class="chip"/><text x="18" y="195" class="label">Underwriting Problem Layer</text>
    <rect y="224" width="250" height="42" class="chip"/><text x="18" y="251" class="label">Reverse Solve / Constraint Engine</text>
  </g>
  <g transform="translate(390 654)">
    <text class="item">This is the new institutional foundation.</text>
    <text y="24" class="item">Everything else in BORB should sit downstream of it.</text>
    <text y="48" class="item">Without these pieces, the product looks like</text>
    <text y="72" class="item">a workflow wrapper around untrusted arithmetic.</text>
  </g>

  <g transform="translate(880 650)">
    <rect width="250" height="42" class="chip"/><text x="18" y="27" class="label">Generic AI Market Narratives</text>
    <rect y="56" width="250" height="42" class="chip"/><text x="18" y="83" class="label">Unsourced Cap Rate Targets</text>
    <rect y="112" width="250" height="42" class="chip"/><text x="18" y="139" class="label">Placeholder Market Metrics</text>
    <rect y="168" width="250" height="42" class="chip"/><text x="18" y="195" class="label">Precise Advice Without Provenance</text>
    <rect y="224" width="250" height="42" class="chip"/><text x="18" y="251" class="label">Weak Valuation Outputs</text>
  </g>
  <g transform="translate(1170 654)">
    <text class="item">If a feature cannot explain where its key</text>
    <text y="24" class="item">numbers come from, it should be downgraded,</text>
    <text y="48" class="item">relabeled, hidden, or removed until it can.</text>
  </g>
</svg>
